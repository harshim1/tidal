# Render Blueprint: dashboard + API + Alexa+ MCP as one Docker web service, serving the
# bundled demo night. Secrets are generated by Render — read them in the service's
# Environment tab. Free instances have 512 MB, so video uploads are off; on a 2 GB plan
# set TIDAL_UPLOADS=1.
services:
  - type: web
    name: tidal
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TIDAL_PUBLIC
        value: "1"
      - key: TIDAL_DEMO
        value: "1"
      - key: TIDAL_UPLOADS
        value: "0"
      - key: TIDAL_UPLOAD_MAX_S
        value: "60"
      - key: TIDAL_PASSWORD
        generateValue: true
      - key: TIDAL_MCP_TOKEN
        generateValue: true
